<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Royal Casino | الكازينو الملكي</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👑</text></svg>">
    <link rel="stylesheet" href="css/main.css">
</head>
<body>

    <!-- شاشة التحميل -->
    <div class="splash-screen" id="splashScreen">
        <div class="splash-content">
            <div class="crown-spin">👑</div>
            <h1 class="splash-title">Royal Casino</h1>
            <div class="loading-bar">
                <div class="loading-fill" id="loadingFill"></div>
            </div>
        </div>
    </div>

    <!-- الأصوات -->
    <audio id="sound-spin" preload="auto" src="sounds/spin.mp3"></audio>
    <audio id="sound-win" preload="auto" src="sounds/win.mp3"></audio>
    <audio id="sound-click" preload="auto" src="sounds/click.mp3"></audio>
    <audio id="sound-coins" preload="auto" src="sounds/coins.mp3"></audio>

    <!-- الهيدر -->
    <header class="header">
        <div class="logo">👑 Royal Casino</div>
        <div class="coins-badge" id="coinsBadge">
            <span class="coin-icon">🪙</span>
            <span id="coinsDisplay">1000</span>
            <span class="plus-btn" id="addCoinsBtn">+</span>
        </div>
    </header>

    <!-- المحتوى الرئيسي -->
    <main class="main-content" id="mainContent">
        <!-- الأقسام -->
        <section class="section">
            <h2 class="section-title"><span class="icon">🔥</span> الألعاب</h2>
            <div class="games-grid" id="gamesGrid">
                <!-- تتولد بالجافاسكريبت -->
            </div>
        </section>

        <section class="section">
            <h2 class="section-title"><span class="icon">🏆</span> أفضل اللاعبين</h2>
            <div class="leaderboard-mini" id="leaderboardMini">
                <!-- تتولد بالجافاسكريبت -->
            </div>
        </section>

        <section class="section">
            <h2 class="section-title"><span class="icon">🎁</span> المكافآت اليومية</h2>
            <div class="daily-reward" id="dailyReward">
                <button class="btn btn-gold" id="claimRewardBtn">🎁 استلم مكافأتك اليومية</button>
                <p class="reward-timer" id="rewardTimer"></p>
            </div>
        </section>
    </main>

    <!-- مودال اللعبة -->
    <div class="modal-overlay" id="gameModal">
        <div class="modal-container">
            <div class="modal-header">
                <h3 id="modalTitle"></h3>
                <button class="modal-close" id="modalClose">✕</button>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- محتوى اللعبة بيتحمل هنا -->
            </div>
            <div class="modal-footer">
                <div class="bet-controls">
                    <label>الرهان:</label>
                    <input type="range" id="betSlider" min="10" max="500" value="50" step="10">
                    <span id="betAmount">50</span> 🪙
                </div>
                <button class="btn btn-gold btn-lg" id="playBtn">🎰 العب</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <!-- الفوتر -->
    <footer class="footer">
        <p>© 2025 Royal Casino | للمتعة فقط - عملات وهمية</p>
    </footer>

    <!-- السكربتات -->
    <script src="js/firebase-config.js"></script>
    <script src="js/sound-manager.js"></script>
    <script src="js/coins-manager.js"></script>
    <script src="js/games-data.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
