<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - الصفحة غير موجودة | الأعيب</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Cairo', 'Segoe UI', sans-serif;
            background: #0f0f1a;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }
        .container { padding: 20px; }
        .code {
            font-size: clamp(80px, 15vw, 140px);
            font-weight: 900;
            color: #6c5ce7;
            text-shadow: 0 0 60px rgba(108,92,231,0.5);
            line-height: 1;
        }
        .msg { font-size: clamp(18px, 3vw, 26px); margin: 16px 0; color: #bbb; }
        .sub { color: #888; margin-bottom: 24px; font-size: 14px; }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #00cec9;
            text-decoration: none;
            font-size: 18px;
            border: 1px solid #00cec9;
            padding: 12px 32px;
            border-radius: 50px;
            transition: 0.3s;
            font-weight: 600;
        }
        .btn:hover { background: #00cec9; color: #000; }
    </style>
</head>
<body>
    <div class="container">
        <div class="code">404</div>
        <div class="msg">الصفحة اللي بتدور عليها مش موجودة!</div>
        <div class="sub">يمكن يكون الرابط اتكتب غلط أو الصفحة اتمسحت.</div>
        <a href="/" class="btn">🏠 رجوع للرئيسية</a>
    </div>
</body>
</html>
