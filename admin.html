<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم | Royal Casino</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>

    <!-- شاشة تسجيل الدخول -->
    <div class="login-overlay" id="loginOverlay">
        <div class="login-box">
            <span class="login-emoji">👑</span>
            <h2>لوحة التحكم</h2>
            <p>Royal Casino</p>
            <input type="password" id="passwordInput" placeholder="كلمة السر" autocomplete="off">
            <div class="login-error" id="loginError">❌ كلمة سر غير صحيحة</div>
            <button class="btn btn-gold" onclick="Admin.checkPassword()">🔓 دخول</button>
        </div>
    </div>

    <!-- المحتوى الرئيسي -->
    <div class="admin-container" id="adminContent" style="display:none">
        <header class="admin-header">
            <h1>👑 Royal Casino - لوحة التحكم</h1>
            <div class="admin-actions">
                <a href="index.html" class="btn btn-outline btn-sm">🏠 الموقع</a>
                <button class="btn btn-outline btn-sm" onclick="Admin.exportData()">💾 تصدير</button>
                <button class="btn btn-outline btn-sm" onclick="document.getElementById('importFile').click()">📥 استيراد</button>
                <button class="btn btn-danger btn-sm" onclick="Admin.resetAll()">🗑️ حذف الكل</button>
            </div>
        </header>

        <input type="file" id="importFile" accept=".json" style="display:none" onchange="Admin.importData(event)">

        <!-- إحصائيات -->
        <div class="stats-grid">
            <div class="stat-card">
                <span class="stat-icon">👥</span>
                <span class="stat-value" id="totalPlayers">0</span>
                <span class="stat-label">لاعبين</span>
            </div>
            <div class="stat-card">
                <span class="stat-icon">🎮</span>
                <span class="stat-value" id="totalGames">0</span>
                <span class="stat-label">جولة</span>
            </div>
            <div class="stat-card">
                <span class="stat-icon">🪙</span>
                <span class="stat-value" id="totalCoins">0</span>
                <span class="stat-label">عملات متداولة</span>
            </div>
        </div>

        <!-- التحكم في الألعاب -->
        <div class="card">
            <h2>🎰 إدارة الألعاب</h2>
            <div class="form-grid">
                <div class="form-group">
                    <label>اسم اللعبة</label>
                    <input type="text" id="gameName" placeholder="ماكينة السلوتس">
                </div>
                <div class="form-group">
                    <label>الأيقونة (إيموجي)</label>
                    <input type="text" id="gameIcon" placeholder="🎰">
                </div>
                <div class="form-group">
                    <label>أقل رهان 🪙</label>
                    <input type="number" id="gameMinBet" value="10" min="1">
                </div>
                <div class="form-group">
                    <label>أكبر رهان 🪙</label>
                    <input type="number" id="gameMaxBet" value="500" min="10">
                </div>
                <div class="form-group">
                    <label>نوع اللعبة</label>
                    <select id="gameType">
                        <option value="حظ">حظ</option>
                        <option value="مهارة">مهارة</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>نسبة الفوز (%)</label>
                    <input type="number" id="gameWinRate" value="45" min="1" max="99">
                </div>
                <div class="form-group full checkbox-group">
                    <label><input type="checkbox" id="gameIsHot"> 🔥 ساخن</label>
                </div>
                <div class="form-group full">
                    <button class="btn btn-gold" onclick="Admin.updateSettings()">💾 حفظ الإعدادات</button>
                </div>
            </div>
        </div>

        <!-- سجل اللاعبين -->
        <div class="card">
            <h2>📋 سجل اللاعبين</h2>
            <div id="playersTable">جاري التحميل...</div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="js/firebase-config.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
